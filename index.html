<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PlumeAI - Rédaction Assistée par IA</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      html.light, html.light body {
        background: linear-gradient(135deg, #e0f2fe 0%, #d1fae5 50%, #dbeafe 100%);
        color: #1e293b;
      }
      html.dark, html.dark body {
        background: linear-gradient(135deg, #0f1f35 0%, #0a2e1f 50%, #0f1f35 100%);
        color: #e2e8f0;
      }
    </style>
    <script>
      (function () {
        const saved = localStorage.getItem('plumeai_theme');
        let theme = 'light';
        if (saved) {
          try {
            const parsed = JSON.parse(saved);
            if (parsed === 'auto') {
              theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
            } else {
              theme = parsed;
            }
          } catch(e) {}
        }
        document.documentElement.className = theme;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
